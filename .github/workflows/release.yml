name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: folio-linux-x86_64
            package: folio-linux-x86_64.tar.gz
            binary: target/release/folio
          - os: macos-latest
            artifact: folio-macos-aarch64
            package: folio-macos-aarch64.dmg
            binary: target/release/folio
          - os: windows-latest
            artifact: folio-windows-x86_64
            package: folio-windows-x86_64.zip
            binary: target/release/folio.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libegl1-mesa-dev libgl1-mesa-dev \
            libvulkan-dev libvulkan1 libssl-dev libasound2-dev
      - name: Report host architecture
        run: uname -m
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - run: cargo build --release --locked
      - name: Check Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          highest=$(objdump -T "${{ matrix.binary }}" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -n1)
          echo "Highest GLIBC symbol: GLIBC_${highest}"
          if [ "$(printf '%s\n2.35\n' "${highest}" | sort -V | tail -n1)" != "2.35" ]; then
            echo "::error::GLIBC_${highest} is newer than the 2.35 baseline in this 22.04 build."
            exit 1
          fi
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" dist/
          cp README.md DESIGN.md PRODUCT.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE dist/
          cp -R licenses dist/
          cp packaging/folio.desktop dist/
          cp assets/icon.png dist/folio.png
          tar -C dist -czf "${{ matrix.package }}" .
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release
          mkdir -p dist
          cp -R "target/release/bundle/osx/Folio.app" dist/
          cp README.md DESIGN.md PRODUCT.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE dist/
          cp -R licenses dist/
          hdiutil create -volname "Folio" -srcfolder dist -ov -format UDZO "${{ matrix.package }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ matrix.binary }}" dist/
          Copy-Item README.md, DESIGN.md, PRODUCT.md, THIRD_PARTY.md, LICENSE-MIT, LICENSE-APACHE dist/
          Copy-Item -Recurse licenses dist/licenses
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.package }}" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        run: |
          cd artifacts
          sha256sum folio-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Folio ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            artifacts/*
            artifacts/SHA256SUMS
          prerelease: false
          make_latest: true
